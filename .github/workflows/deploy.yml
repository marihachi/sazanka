# pagesブランチ に push したら、ビルドして GitHub Pages に公開する
name: Deploy

on:
  push:
    branches: [pages]
  # 手動でも実行できるようにする
  workflow_dispatch:

# Pages への公開に必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 公開は1つずつ。実行中のものは終わらせてから次を流す
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # 型チェックとビルド
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
