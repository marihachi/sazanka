<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 28" width="116" height="28">
  <defs>
    <!-- 先のとがった花びら。中心の少し外側から上に伸びる -->
    <path id="petal" d="M14,12 C10.6,9.6 10.6,5.4 14,1.8 C17.4,5.4 17.4,9.6 14,12 Z"/>
  </defs>
  <!-- 山茶花 (さざんか) の花: 5枚の花びらを 72° ずつ回して並べる -->
  <g fill="#000" transform="translate(0,0.6)">
    <use href="#petal"/>
    <use href="#petal" transform="rotate(72 14 14)"/>
    <use href="#petal" transform="rotate(144 14 14)"/>
    <use href="#petal" transform="rotate(216 14 14)"/>
    <use href="#petal" transform="rotate(288 14 14)"/>
    <circle cx="14" cy="14" r="1.3"/>
  </g>
  <text x="30" y="20" font-family="system-ui, sans-serif" font-size="17" font-weight="600" letter-spacing="0.5" fill="#000">sazanka</text>
</svg>
